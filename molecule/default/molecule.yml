---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu
    image: ubuntu:20.04

provisioner:
  name: ansible
  env:
    # Molecule stopped symlinking this checkout under its own directory
    # name, which is what let converge.yml resolve
    # `include_role: name: ansible-role-git` implicitly. ../../.. from
    # here (molecule/default/) is this repo's parent directory, so
    # Ansible can resolve the checkout itself as a role again.
    ANSIBLE_ROLES_PATH: ../../..
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer, yaml
    ssh_connection:
      pipelining: false

verifier:
  name: ansible

lint: |
  set -e
  yamllint .
  ansible-lint .

scenario:
  name: default
  test_sequence:
    - destroy
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy

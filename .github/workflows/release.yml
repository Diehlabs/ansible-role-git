name: Ansible Release
on:
  workflow_run:
    workflows:
      - 'Ansible CI'
    branches:
      - main
    types:
      - completed

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: Diehlabs/shared-workflows/.github/workflows/github-release.yml@0dad30a300167504c240e28f9495d9aba525651c # v0.2.15
    secrets: inherit
